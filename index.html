<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101116">
<title>MyCorner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --obsidian:#101116; --graphite:#191B23; --graphite2:#21242e; --porcelain:#E8E8ED;
  --violet:#9B79FF; --silver:#777C8B; --line:rgba(232,232,237,.08);
  --side:76px; --radius:14px;
  --display:'Sora',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{background:var(--obsidian);color:var(--porcelain);font:15px/1.5 var(--body);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Layout: sidebar on desktop, bottom bar on mobile */
nav.main{position:fixed;z-index:50;background:rgba(16,17,22,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.main .logo{display:none}
nav.main a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--silver);padding:6px 8px;border-radius:10px;transition:color .2s}
nav.main a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.main a.on{color:var(--violet)}
nav.main a.hide-m{display:none}
main{padding:0 0 90px;min-height:100vh}
.wrap{padding:0 18px;max-width:1500px;margin:0 auto}
@media(min-width:900px){
  nav.main{top:0;bottom:auto;right:auto;width:var(--side);height:100vh;flex-direction:column;justify-content:flex-start;align-items:center;
    gap:6px;border-top:0;border-right:1px solid var(--line);padding:18px 0}
  nav.main .logo{display:grid;place-items:center;width:44px;height:44px;margin-bottom:18px;border-radius:12px;font:700 20px var(--display);
    background:linear-gradient(135deg,var(--violet),#5d3fd3);color:#fff}
  nav.main a{width:62px}
  nav.main a.hide-m{display:flex}
  nav.main a.push{margin-top:auto}
  main{margin-left:var(--side);padding-bottom:50px}
  .wrap{padding:0 40px}
}

/* Hero */
.hero{position:relative;min-height:min(78vh,620px);display:flex;align-items:flex-end;overflow:hidden;background:var(--graphite)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 25%;transform:scale(1.04);animation:drift 24s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;background:
  linear-gradient(0deg,var(--obsidian) 4%,rgba(16,17,22,.55) 45%,rgba(16,17,22,.15)),
  linear-gradient(90deg,rgba(16,17,22,.85),transparent 70%)}
.hero .copy{position:relative;z-index:2;padding:90px 18px 44px;max-width:680px;animation:rise .8s both}
@media(min-width:900px){.hero .copy{padding:90px 40px 60px}}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--violet);font-weight:600}
.hero h1{font:700 clamp(30px,5.4vw,56px)/1.08 var(--display);margin:10px 0 12px;letter-spacing:-.02em}
.hero p{color:#c4c6d0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:56ch}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:600;font-size:14px;transition:transform .15s,background .2s,border-color .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--violet);color:#14102a}
.btn.primary:hover{background:#b095ff}
.btn.ghost{background:rgba(232,232,237,.08);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(232,232,237,.14)}
.btn.small{padding:7px 14px;font-size:13px}
.btn.danger{border:1px solid rgba(255,110,110,.4);color:#ff9a9a}
.btn[disabled]{opacity:.5;pointer-events:none}

/* Rows & cards */
section.row{margin-top:34px;animation:rise .6s both}
.row-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.row-head h2{font:600 19px var(--display);letter-spacing:-.01em}
.row-head a{font-size:13px;color:var(--silver)}
.row-head a:hover{color:var(--violet)}
.scroller{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--graphite2) transparent}
.scroller>*{flex:0 0 min(72vw,270px);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{position:relative;display:block;transition:transform .25s}
.card:hover{transform:translateY(-4px)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:var(--graphite) linear-gradient(110deg,var(--graphite) 30%,var(--graphite2) 50%,var(--graphite) 70%);background-size:200% 100%;animation:shimmer 1.6s linear infinite;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .thumb img{transform:scale(1.06)}
.thumb .tag{position:absolute;left:8px;bottom:8px;padding:2px 8px;border-radius:999px;background:rgba(16,17,22,.78);font-size:11px;backdrop-filter:blur(6px)}
.thumb .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15)}
.thumb .bar i{display:block;height:100%;background:var(--violet)}
.card h3{font:500 14px/1.35 var(--body);margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:var(--silver);margin-top:2px}
.heart{position:absolute;top:8px;right:8px;z-index:3;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(16,17,22,.7);backdrop-filter:blur(6px);opacity:0;transition:opacity .2s}
.card:hover .heart,.heart.on,.heart:focus-visible{opacity:1}
@media(hover:none){.heart{opacity:1}}
.heart svg{width:16px;height:16px;stroke:var(--porcelain);fill:none;stroke-width:2}
.heart.on svg{fill:var(--violet);stroke:var(--violet)}

/* Page chrome */
.page-head{padding:34px 0 8px;animation:rise .5s both}
.page-head h1{font:700 30px var(--display);letter-spacing:-.02em}
.page-head p{color:var(--silver);margin-top:4px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px}
input[type=text],input[type=search],input[type=password],input[type=number],select{background:var(--graphite);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
input:focus,select:focus{border-color:var(--violet);outline:0}
.tools input{flex:1 1 240px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--silver);background:var(--graphite)}
.chip.on{background:rgba(155,121,255,.16);border-color:var(--violet);color:var(--porcelain)}
.panel{background:var(--graphite);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
.panel h3{font:600 16px var(--display);margin-bottom:6px}
.panel p,.muted{color:var(--silver);font-size:13.5px}
.log{white-space:pre-wrap;font:12.5px/1.6 ui-monospace,Menlo,monospace;color:#b9bccb;background:var(--obsidian);border-radius:10px;padding:12px;margin-top:12px;max-height:240px;overflow:auto}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-size:13px;color:var(--silver)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border:0}
.switch input{width:20px;height:20px;accent-color:var(--violet)}
.empty{text-align:center;padding:60px 20px;color:var(--silver)}
.empty h2{color:var(--porcelain);font:600 20px var(--display);margin-bottom:6px}

/* Anime detail */
.detail-hero{position:relative;min-height:380px;display:flex;align-items:flex-end;overflow:hidden}
.detail-hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:saturate(1.1)}
.detail-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--obsidian) 6%,rgba(16,17,22,.6) 60%,rgba(16,17,22,.3))}
.detail-hero .copy{position:relative;z-index:2;padding:80px 18px 28px;max-width:760px}
@media(min-width:900px){.detail-hero .copy{padding:80px 40px 34px}}
.detail-hero h1{font:700 clamp(28px,4.6vw,46px)/1.1 var(--display);letter-spacing:-.02em;margin:8px 0}
.seasonbar{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
.eplist{display:grid;gap:10px}
.ep{display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:center;padding:8px;border-radius:12px;border:1px solid transparent;transition:background .2s}
.ep:hover{background:var(--graphite)}
.ep.now{background:rgba(155,121,255,.12);border-color:rgba(155,121,255,.4)}
.ep .thumb{border-radius:9px}
.ep .t{font-weight:500;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep .s{font-size:12px;color:var(--silver);margin-top:2px}
.ep .edit{opacity:.5;font-size:12px;padding:6px 8px}
.ep .edit:hover{opacity:1;color:var(--violet)}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:rgba(255,160,90,.15);color:#ffb482;margin-left:6px}

/* Watch */
.watch{display:grid;gap:22px;padding-top:18px}
@media(min-width:1100px){.watch{grid-template-columns:minmax(0,1fr) 380px;align-items:start}}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.player iframe,.player>div{position:absolute;inset:0;width:100%;height:100%}
.perror{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;padding:24px;background:var(--graphite);z-index:3}
.perror h3{font:600 18px var(--display)}
.watch h1{font:600 22px/1.25 var(--display);margin:16px 0 4px}
.sidelist{max-height:640px;overflow:auto;padding-right:4px}

/* Misc */
footer{margin-top:60px;padding:24px 18px;border-top:1px solid var(--line);color:var(--silver);font-size:12px;text-align:center}
footer a{text-decoration:underline}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);z-index:99;background:var(--graphite2);border:1px solid var(--line);
  padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;max-width:88vw;white-space:pre-line;font-size:13.5px}
#toast.on{opacity:1;transform:translateX(-50%)}
dialog{background:var(--graphite);color:var(--porcelain);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes drift{to{transform:scale(1.1) translateX(-1.5%)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="main" id="nav" aria-label="Main"></nav>
<main id="app" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ==========================================================================
   MyCorner — single-file personal anime hub for official YouTube channels.
   Sections: 1 helpers · 2 state · 3 YouTube API · 4 sync · 5 catalog
   · 6 player · 7 views · 8 router · 9 events
   ========================================================================== */

/* ---------- 1. Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = s => s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "untitled";
const sleep = ms => new Promise(r => setTimeout(r, ms));
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 3800);
}
function fmtDur(sec) {
  if (!sec) return "";
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}
function isoToSec(iso = "") {
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/) || [];
  return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
}
const ago = ts => {
  const d = (Date.now() - ts) / 864e5;
  return d < 1 ? "today" : d < 2 ? "yesterday" : d < 30 ? `${Math.floor(d)} days ago` : new Date(ts).toLocaleDateString();
};

/* ---------- 2. State (everything personal stays in this browser) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("mc." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) {
    try { localStorage.setItem("mc." + k, JSON.stringify(v)); return true; }
    catch { toast("Browser storage is full or blocked, so this change was not saved.\nTry clearing the catalog cache in Settings."); return false; }
  }
};
const DEFAULT_PROVIDERS = [{
  id: "muse-asia", name: "Muse Asia", handle: "@MuseAsia", channelId: "", uploadsId: "", logo: "", enabled: true, lastSync: 0
}];
const S = {
  settings: { apiKey: "", autoNext: true, resume: true, ...store.get("settings", {}) },
  providers: store.get("providers", DEFAULT_PROVIDERS),
  catalog: store.get("catalog", {}),     // providerId -> { videos, playlists, syncedAt }
  overrides: store.get("overrides", {}), // videoId -> manual corrections (preserved across syncs)
  ignoredPl: store.get("ignoredPl", {}), // playlistId -> true/false (manual playlist include/exclude)
  watchlist: store.get("watchlist", []), // anime ids
  history: store.get("history", {}),     // videoId -> { pos, dur, at, anime }
  blocked: store.get("blocked", {}),     // videoId -> YouTube error code seen in the player
  syncLog: []
};
const save = k => store.set(k, S[k]);
let libCache = null;
const invalidate = () => { libCache = null; };

/* ---------- 3. YouTube Data API v3 (quota-aware) ---------- */
class ApiError extends Error { constructor(msg, code) { super(msg); this.code = code; } }
let quotaUsed = 0, cancelSync = false; // quotaUsed counts requests this session (each costs 1 unit here)
const ytCache = new Map(); // short-lived in-memory cache for identical requests
async function yt(endpoint, params, { retries = 2 } = {}) {
  if (!S.settings.apiKey) throw new ApiError("No YouTube API key is set.\nOpen Settings and paste your key first.", "nokey");
  const qs = new URLSearchParams({ ...params, key: S.settings.apiKey });
  const url = `https://www.googleapis.com/youtube/v3/${endpoint}?${qs}`;
  const hit = ytCache.get(url);
  if (hit && Date.now() - hit.at < 60000) return hit.data;
  for (let attempt = 0; ; attempt++) {
    let res;
    try { res = await fetch(url); }
    catch {
      if (attempt < retries) { await sleep(800 * 2 ** attempt); continue; }
      throw new ApiError("Could not reach YouTube.\nCheck your internet connection and try again.", "network");
    }
    if (res.ok) { quotaUsed++; const data = await res.json(); ytCache.set(url, { at: Date.now(), data }); return data; }
    const body = await res.json().catch(() => ({}));
    const reason = body?.error?.errors?.[0]?.reason || "";
    if (res.status >= 500 && attempt < retries) { await sleep(800 * 2 ** attempt); continue; }
    if (reason === "quotaExceeded" || reason === "dailyLimitExceeded")
      throw new ApiError("YouTube's daily quota for your API key is used up.\nIt resets at midnight Pacific Time. Your saved catalog still works, so you can sync again tomorrow.", "quota");
    if (reason === "keyInvalid" || reason === "API_KEY_INVALID" || res.status === 400 && /key/i.test(body?.error?.message || ""))
      throw new ApiError("YouTube rejected the API key.\nCheck that it was pasted correctly and that YouTube Data API v3 is enabled for it.", "key");
    if (res.status === 403)
      throw new ApiError("YouTube refused this request (403).\nIf you set an HTTP referrer restriction on the key, make sure it includes this site's address.", "forbidden");
    throw new ApiError(`YouTube returned an error (${res.status}${reason ? ", " + reason : ""}).`, "http");
  }
}
const bestThumb = t => (t?.maxres || t?.standard || t?.high || t?.medium || t?.default)?.url || "";

/* ---------- 4. Synchronization ---------- */
const log = line => {
  S.syncLog.push(`${new Date().toLocaleTimeString()}  ${line}`);
  const el = $("#synclog"); if (el) { el.textContent = S.syncLog.join("\n"); el.scrollTop = el.scrollHeight; }
};
function compactVideo(v) {
  return {
    id: v.id, t: v.snippet?.title || "", d: (v.snippet?.description || "").slice(0, 400),
    th: bestThumb(v.snippet?.thumbnails), pub: Date.parse(v.snippet?.publishedAt) || 0,
    dur: isoToSec(v.contentDetails?.duration), emb: v.status?.embeddable !== false,
    priv: v.status?.privacyStatus || "public", rr: v.contentDetails?.regionRestriction || null,
    vc: +v.statistics?.viewCount || 0, at: Date.now()
  };
}
async function fetchVideos(ids) {
  const out = [];
  for (let i = 0; i < ids.length; i += 50) {
    const r = await yt("videos", { part: "snippet,contentDetails,status,statistics", id: ids.slice(i, i + 50).join(","), maxResults: 50 });
    out.push(...(r.items || []).map(compactVideo));
  }
  return out;
}
async function resolveChannel(p) {
  if (p.channelId && p.uploadsId) return;
  const params = { part: "snippet,contentDetails" };
  if (p.channelId) params.id = p.channelId; else params.forHandle = p.handle.startsWith("@") ? p.handle : "@" + p.handle;
  const r = await yt("channels", params);
  const ch = r.items?.[0];
  if (!ch) throw new ApiError(`No channel was found for "${p.channelId || p.handle}".\nOpen the provider's settings and enter its official channel ID (it starts with UC).`, "nochannel");
  p.channelId = ch.id; p.uploadsId = ch.contentDetails.relatedPlaylists.uploads;
  p.logo = ch.snippet.thumbnails?.medium?.url || ch.snippet.thumbnails?.default?.url || "";
  log(`Channel found: ${ch.snippet.title}`);
}
const BATCH_LIMIT = 200;   // videos loaded per press: the first sync and each "Load older" press
const MAX_PAGES = 40;      // hard safety stop per run (40 pages = 2,000 videos)
/* Walks the uploads playlist newest-first. Every page is saved immediately, so quota already spent is never lost.
   stopAtKnown: stop at the first video we already have (cheap "what's new" check).
   Returns where it stopped so "Load older" can resume from there. */
async function scanUploads(p, cat, startToken, { stopAtKnown, limit }) {
  let token = startToken, added = 0, pages = 0, hitKnown = false;
  while (pages < MAX_PAGES && added < limit && !cancelSync) {
    const r = await yt("playlistItems", { part: "contentDetails", playlistId: p.uploadsId, maxResults: 50, ...(token && { pageToken: token }) });
    pages++;
    const fresh = [];
    for (const it of r.items || []) {
      const id = it.contentDetails.videoId;
      if (cat.videos[id]) { if (stopAtKnown) { hitKnown = true; break; } continue; }
      fresh.push(id);
    }
    if (fresh.length) {
      for (const v of await fetchVideos(fresh)) cat.videos[v.id] = v;
      added += fresh.length; save("catalog");
    }
    token = r.nextPageToken || "";
    log(`Page ${pages}: ${fresh.length} new video(s), ${Object.keys(cat.videos).length} stored in total.`);
    if (hitKnown || !token) break;
  }
  return { added, token, hitKnown, pages };
}
const GAP_LIMIT = 1000; // max playlist videos fetched per run (1000 videos = about 20 quota units)
/* Videos that appear in an official playlist but are not stored yet. IDs YouTube already told us it cannot return
   (deleted, private) are remembered in cat.missing so we do not ask for them again on every sync. */
function pendingGaps(cat) {
  const want = new Set(), skip = cat.missing || {};
  for (const pl of Object.values(cat.playlists)) {
    if (plIgnored(pl)) continue;
    for (const id of pl.items) if (!cat.videos[id] && !skip[id]) want.add(id);
  }
  return [...want];
}
async function fillPlaylistGaps(cat) {
  cat.missing ||= {};
  const all = pendingGaps(cat), ids = all.slice(0, GAP_LIMIT);
  if (!ids.length) return log("Playlists are complete: every listed video is already stored.");
  log(`Fetching ${ids.length} video(s) that playlists list but you don't have yet${all.length > ids.length ? ` (${all.length - ids.length} more on the next sync)` : ""}...`);
  let fetched = 0, gone = 0;
  for (let i = 0; i < ids.length && !cancelSync; i += 50) {
    const chunk = ids.slice(i, i + 50), got = await fetchVideos(chunk), seen = new Set(got.map(v => v.id));
    got.forEach(v => { cat.videos[v.id] = v; });
    chunk.filter(id => !seen.has(id)).forEach(id => { cat.missing[id] = Date.now(); gone++; });
    fetched += got.length; save("catalog");
    log(`Playlist videos fetched: ${fetched} of ${ids.length}.`);
  }
  if (gone) log(`${gone} listed video(s) are deleted or private, so they were skipped.`);
}
async function syncProvider(p, { more = false } = {}) {
  S.syncLog = []; cancelSync = false; const startQuota = quotaUsed;
  const cat = S.catalog[p.id] ||= { videos: {}, playlists: {}, syncedAt: 0, olderToken: "", complete: false };
  try {
    await resolveChannel(p);
    const empty = !Object.keys(cat.videos).length;
    if (more) {
      if (!cat.olderToken) { log("There are no older videos left to load."); return; }
      log(`Loading up to ${BATCH_LIMIT} older videos...`);
      const r = await scanUploads(p, cat, cat.olderToken, { stopAtKnown: false, limit: BATCH_LIMIT });
      cat.olderToken = r.token; cat.complete = !r.token;
      log(r.token ? `Done. Press "Load older videos" again if you want more.` : "Done. You now have the channel's complete upload history.");
    } else {
      log(empty ? `First sync: loading the newest ${BATCH_LIMIT} videos. You can load older ones afterwards.` : "Checking for new videos...");
      const r = await scanUploads(p, cat, "", { stopAtKnown: !empty, limit: BATCH_LIMIT });
      if (empty) { cat.olderToken = r.token; cat.complete = !r.token; }
      log(r.added ? `Added ${r.added} new video(s).` : "No new videos.");
    }
    if (cancelSync) { log("Stopped by you. Everything fetched so far was saved."); return; }
    // Official playlists define anime groups and episode order. Unchanged playlists are skipped to save quota.
    log("Reading official playlists...");
    const pls = []; let token = "";
    do {
      const r = await yt("playlists", { part: "snippet,contentDetails", channelId: p.channelId, maxResults: 50, ...(token && { pageToken: token }) });
      pls.push(...(r.items || [])); token = r.nextPageToken;
    } while (token && pls.length < 500 && !cancelSync);
    const live = new Set(pls.map(x => x.id));
    for (const id of Object.keys(cat.playlists)) if (!live.has(id)) delete cat.playlists[id];
    let touched = 0;
    for (const pl of pls) {
      if (cancelSync) break;
      const old = cat.playlists[pl.id], n = pl.contentDetails.itemCount;
      if (old && old.count === n) continue;
      const items = []; let t2 = "";
      if (n > 0) do {
        const r = await yt("playlistItems", { part: "contentDetails", playlistId: pl.id, maxResults: 50, ...(t2 && { pageToken: t2 }) });
        items.push(...(r.items || []).map(i => i.contentDetails.videoId)); t2 = r.nextPageToken;
      } while (t2 && !cancelSync);
      cat.playlists[pl.id] = { id: pl.id, title: pl.snippet.title, count: n, items };
      touched++; if (touched % 10 === 0) { save("catalog"); log(`Playlists updated so far: ${touched}`); }
    }
    log(`Playlists: ${pls.length} found, ${touched} updated.`);
    if (!cancelSync) await fillPlaylistGaps(cat);
    cat.syncedAt = p.lastSync = Date.now();
    log(cancelSync ? "Stopped by you. Everything fetched so far was saved." : "Sync finished.");
  } catch (e) {

}
/* Metadata refresh + availability check. Re-reads every stored video, drops deleted ones (YouTube policy), updates embeddable/private/stats. */
async function refreshProvider(p) {
  S.syncLog = []; const cat = S.catalog[p.id];
  if (!cat || !Object.keys(cat.videos).length) return toast("Nothing to refresh yet.\nRun a sync first.");
  try {
    cat.missing = {}; const ids = Object.keys(cat.videos); log(`Refreshing ${ids.length} video(s)...`);
    const got = await fetchVideos(ids), seen = new Set(got.map(v => v.id));

/* ---------- 5. Catalog: identify anime, seasons, episodes ---------- */
const NOISE = /\b(multi[- ]?sub(s|titles?)?|eng(lish)? sub(s|bed)?|sub(bed)?|dub(bed)?|full episode|official|hd|4k)\b/gi;
const EP_RE = /\bep(?:isode)?\.?\s*#?\s*(\d{1,4})\b|\bS\d{1,2}\s*E(\d{1,4})\b|#\s*(\d{1,4})\b/i;
const SEASON_RE = /\bseason\s*(\d{1,2})\b|\bS(\d{1,2})(?=\s|$|[^\w])|\b(\d{1,2})(?:st|nd|rd|th)\s+season\b/i;
const parseEp = s => { const m = s.match(EP_RE); return m ? +(m[1] || m[2] || m[3]) : null; };
const parseSeason = s => { if (!s) return null; const m = s.match(SEASON_RE); return m ? +(m[1] || m[2] || m[3]) : null; };
function classify(title) {
  if (/\b(trailer|pv|teaser|promo|cm)\b/i.test(title)) return "trailer";
  if (/\brecap\b/i.test(title)) return "recap";
  if (/\bova\b|\boad\b/i.test(title)) return "ova";
  if (/\bmovie\b|\bthe film\b/i.test(title)) return "movie";
  if (/\bspecial\b/i.test(title)) return "special";
  return EP_RE.test(title) ? "episode" : "other";
}
function cleanTitle(raw) {
  let s = raw.split(/\s*[|｜]\s*/).find(p => p && !EP_RE.test(p) && !/^(multi|eng|sub)/i.test(p)) || raw;
  s = s.replace(/[\[【(][^\]】)]*[\]】)]/g, " ")
       .replace(EP_RE, " ").replace(SEASON_RE, " ").replace(NOISE, " ")
       .replace(/\b(trailer|pv|teaser|recap|ova|oad|special)\b/gi, " ")
       .replace(/[-–—:]+\s*$/g, " ").replace(/^\s*[-–—:]+/g, " ").replace(/\s+/g, " ").trim();
  return s || raw.trim();
}
const DEFAULT_IGNORE = /\b(popular|all (anime|episodes|videos)|latest|new (releases|uploads)|shorts|live|streams?|full (series|catalog))\b/i;
const plIgnored = pl => S.ignoredPl[pl.id] ?? DEFAULT_IGNORE.test(pl.title);
const TYPE_LABEL = { episode: "Episode", special: "Special", movie: "Movie", ova: "OVA", trailer: "Trailer", recap: "Recap", other: "Other" };
const TYPE_ORDER = ["episode", "special", "movie", "ova", "recap", "trailer", "other"];

function buildLibrary() {
  if (libCache) return libCache;
  const animeMap = new Map(), videos = new Map();
  for (const p of S.providers) {
    const cat = S.catalog[p.id]; if (!cat) continue;
    // Priority 1+2: official playlists and their ordering. The most specific (smallest) playlist wins.
    const member = new Map();
    Object.values(cat.playlists).filter(pl => !plIgnored(pl)).sort((a, b) => a.items.length - b.items.length)
      .forEach(pl => pl.items.forEach((id, i) => { if (!member.has(id)) member.set(id, { title: pl.title, index: i }); }));
    for (const v of Object.values(cat.videos)) {
      if (v.priv === "private") continue;
      const o = S.overrides[v.id] || {}, m = member.get(v.id);
      // Priority 3: title parsing. Priority 4: descriptions are kept for synopsis only. Priority 5: manual overrides win over everything.
      let type = o.type || classify(v.t);
      if (!o.type && type === "other" && m) type = "episode";
      const title = (o.anime || cleanTitle(m ? m.title : v.t)).trim();
      const season = o.season ?? parseSeason(m?.title) ?? parseSeason(v.t) ?? 1;
      const ep = o.ep ?? parseEp(v.t) ?? (m && type === "episode" ? m.index + 1 : null);
      const id = `${p.id}:${slug(title)}`;
      let a = animeMap.get(id);
      if (!a) animeMap.set(id, a = { id, providerId: p.id, provider: p.name, title, items: [] });
      const item = { ...v, videoId: v.id, type, season, ep, animeId: id, pl: m?.title || "" };
      a.items.push(item); videos.set(v.id, { item, anime: a });
    }
  }
  for (const a of animeMap.values()) {
    a.items.sort((x, y) => x.season - y.season || TYPE_ORDER.indexOf(x.type) - TYPE_ORDER.indexOf(y.type) || (x.ep ?? 1e9) - (y.ep ?? 1e9) || x.pub - y.pub);
    a.episodes = a.items.filter(i => i.type === "episode");
    const first = a.episodes[0] || a.items[0];
    a.thumb = first.th; a.latest = Math.max(...a.items.map(i => i.pub));
    a.views = a.items.reduce((n, i) => n + i.vc, 0);
    a.seasons = [...new Set(a.items.map(i => i.season))].sort((x, y) => x - y);
    a.synopsis = (a.items.find(i => i.type === "episode" && i.d.length > 40)?.d || first.d || "")
      .replace(/https?:\/\/\S+/g, "").split("\n").map(s => s.trim()).filter(Boolean).slice(0, 3).join(" ");
  }
  const anime = [...animeMap.values()].sort((a, b) => b.latest - a.latest);
  return libCache = { anime, byId: animeMap, videos };
}
const enabledAnime = () => buildLibrary().anime.filter(a => S.providers.find(p => p.id === a.providerId)?.enabled);

let ytReady = null, player = null, tick = null, curVideo = null;
function loadYT() {

    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; s.onerror = () => rej(new Error("blocked"));
    document.head.appendChild(s); setTimeout(() => rej(new Error("timeout")), 15000);

}
function saveProgress(force) {
  if (!player?.getCurrentTime || !curVideo) return;
  try {
    const pos = Math.floor(player.getCurrentTime()), dur = Math.floor(player.getDuration() || 0);
    if (!force && pos < 3) return;
    S.history[curVideo.item.videoId] = { pos, dur, at: Date.now(), anime: curVideo.anime.id };
    save("history");
  } catch { /* player not ready */ }
}
function destroyPlayer() {

}
const PLAYER_ERRORS = {
  2: "This video's ID is invalid.",
  5: "Your browser hit a playback problem with this video.",
  100: "This video was removed or made private.",
  101: "The owner has turned off embedding, so it can only be watched on YouTube.",
  150: "The owner has turned off embedding, so it can only be watched on YouTube.",
  153: "YouTube could not verify this page's address.\nOpen MyCorner from a web address (https:// or http://localhost), not by double-clicking the file."
};
function showPlayerError(msg, vid) {
  const box = $("#player"); if (!box) return;
  box.insertAdjacentHTML("beforeend", `<div class="perror"><h3>This episode can't play here</h3><p class="muted" style="white-space:pre-line">${esc(msg)}</p>
    <div class="btns" style="justify-content:center"><a class="btn primary small" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${esc(vid)}">Watch on YouTube</a></div></div>`);
}
async function startPlayer(vid) {
  const cur = buildLibrary().videos.get(vid); if (!cur) return;
  curVideo = cur;
  const v = cur.item, h = S.history[vid];
  if (S.blocked[vid]) return showPlayerError(PLAYER_ERRORS[S.blocked[vid]] || "This video is unavailable.", vid);
  if (!v.emb) return showPlayerError(PLAYER_ERRORS[101], vid);
  try { await loadYT(); }
  catch { return showPlayerError("The YouTube player could not load.\nAn ad blocker or network restriction may be blocking youtube.com.", vid); }
  if (curVideo?.item.videoId !== vid || !$("#yt")) return; // user navigated away while loading
  const start = S.settings.resume && h && h.pos > 10 && (!h.dur || h.pos < h.dur - 15) ? h.pos : 0;
  const vars = { rel: 0, playsinline: 1, modestbranding: 1, start };
  if (location.protocol.startsWith("http")) vars.origin = location.origin;

    videoId: vid, playerVars: vars, width: "100%", height: "100%",
    events: {

        else if (e.data === YT.PlayerState.PAUSED) { clearInterval(tick); saveProgress(true); }
        else if (e.data === YT.PlayerState.ENDED) {

      onError: e => {

        const nx = neighbours(vid).next; if (nx && S.settings.autoNext && e.data !== 153) toast("Skipping to the next episode.");
        if (nx && S.settings.autoNext && e.data !== 153) setTimeout(() => location.hash = `#/watch/${nx.videoId}`, 2500);
      }

}

      <div><h3 style="margin:0">${esc(p.name)}${p.enabled ? "" : '<span class="badge">disabled</span>'}</h3><p>${n} videos · ${p.lastSync ? "synced " + ago(p.lastSync) : "never synced"}</p></div></a>`;
  }).join("")}</div>
  <div class="panel" style="margin-top:22px"><h3>Add a provider</h3><p>Enter the official channel's handle (like @AniOneAsia) or its channel ID (starts with UC). Only add official distributors.</p>
    <div class="field"><label for="np-name">Display name</label><input id="np-name" type="text" placeholder="Ani-One Asia"></div>
    <div class="field"><label for="np-ref">Handle or channel ID</label><input id="np-ref" type="text" placeholder="@AniOneAsia"></div>
    <button class="btn primary small" data-act="addprov">Add provider</button></div></div>${FOOTER}`;
}
function viewProvider(id) {
  const p = S.providers.find(x => x.id === id); if (!p) return notFound();
  const cat = S.catalog[id], list = buildLibrary().anime.filter(a => a.providerId === id);
  const pls = cat ? Object.values(cat.playlists).sort((a, b) => a.title.localeCompare(b.title)) : [];
  const gaps = cat ? pendingGaps(cat).length : 0;
  return `<div class="wrap">${pageHead(p.name, p.lastSync ? `Last synced ${ago(p.lastSync)} · ${cat ? Object.keys(cat.videos).length : 0} videos · ${pls.length} playlists${gaps ? ` · ${gaps} playlist video(s) waiting to be fetched (press Sync new videos)` : ""}` : "Not synced yet")}
    <div class="btns" style="margin:14px 0"><button class="btn primary small" data-act="sync" data-id="${esc(id)}">Sync new videos</button>
      ${cat && cat.olderToken ? `<button class="btn ghost small" data-act="more" data-id="${esc(id)}">Load ${BATCH_LIMIT} older videos</button>` : ""}
      <button class="btn danger small" data-act="stop" hidden>Stop</button>
      <button class="btn ghost small" data-act="refresh" data-id="${esc(id)}">Refresh metadata &amp; availability</button>
      <button class="btn ghost small" data-act="togprov" data-id="${esc(id)}">${p.enabled ? "Disable" : "Enable"}</button></div>
    <div class="log" id="synclog" ${S.syncLog.length ? "" : 'hidden'}>${esc(S.syncLog.join("\n"))}</div>
    <p class="muted" style="margin-top:10px">Sync reads only what changed, so it stays cheap on your daily YouTube quota (10,000 units). A refresh re-checks every stored video, so run it occasionally.</p>
    <div style="margin-top:26px">${grid(list, "No anime yet. Press Sync new videos above.")}</div>
    ${pls.length ? `<div class="panel" style="margin-top:30px"><h3>Playlists used for grouping</h3><p>Official playlists define anime titles, seasons and episode order. Untick any that are just collections (like "Popular"). Unticking regroups instantly. A newly ticked playlist fetches its missing videos on the next sync.</p>
      ${pls.map(pl => `<label class="switch"><span>${esc(pl.title)} <span class="muted">(${pl.count})</span></span><input type="checkbox" data-act="plgroup" data-id="${esc(pl.id)}" ${plIgnored(pl) ? "" : "checked"}></label>`).join("")}</div>` : ""}</div>${FOOTER}`;
}
function viewAnime(id) {
  const a = buildLibrary().byId.get(id); if (!a) return notFound();
  const season = +(location.hash.match(/[?&]s=(\d+)/)?.[1] || a.seasons[0]);
  const inSeason = a.items.filter(i => i.season === season);
  const first = a.episodes.find(e => S.history[e.videoId]) || a.episodes[0] || a.items[0];
  const groups = TYPE_ORDER.map(t => [t, inSeason.filter(i => i.type === t)]).filter(([, l]) => l.length);
  const srcPl = [...new Set(inSeason.map(i => i.pl).filter(Boolean))];
  return `<section class="detail-hero"><div class="bg" style="background-image:url('${esc(a.thumb)}')"></div><div class="copy">
      <span class="eyebrow">${esc(a.provider)}</span><h1>${esc(a.title)}</h1><p class="muted" style="color:#c4c6d0;max-width:60ch">${esc(a.synopsis)}</p>
      <div class="btns"><a class="btn primary" href="#/watch/${esc(first.videoId)}">${svg("play", 'width="16" height="16"')} ${S.history[first.videoId] ? "Continue" : "Watch Now"}</a>
      <button class="btn ghost" data-act="wl" data-id="${esc(a.id)}">${S.watchlist.includes(a.id) ? "Remove from Watchlist" : "Add to Watchlist"}</button></div></div></section>
    <div class="wrap">${a.seasons.length > 1 ? `<div class="seasonbar">${a.seasons.map(s => `<a class="chip ${s === season ? "on" : ""}" href="#/anime/${encodeURIComponent(id)}?s=${s}">Season ${s}</a>`).join("")}</div>` : '<div style="height:22px"></div>'}
    ${srcPl.length ? `<p class="muted">Grouped from playlist${srcPl.length > 1 ? "s" : ""}: ${esc(srcPl.join(" · "))}</p>` : ""}
    ${groups.map(([t, l]) => `<h2 style="font:600 17px var(--display);margin:20px 0 10px">${TYPE_LABEL[t]}${t === "episode" ? "s" : l.length > 1 ? "s" : ""}</h2><div class="eplist">${l.map(i => epRow(i)).join("")}</div>`).join("")}</div>${FOOTER}`;
}
function epRow(i, current) {
  const h = S.history[i.videoId], pct = h?.dur ? Math.min(100, h.pos / h.dur * 100) : 0;
  const bad = S.blocked[i.videoId] || !i.emb;
  return `<div class="ep ${i.videoId === current ? "now" : ""}"><a class="thumb" href="#/watch/${esc(i.videoId)}" aria-label="Play">${i.th ? `<img loading="lazy" src="${esc(i.th)}" alt="">` : ""}
      ${i.dur ? `<span class="tag">${fmtDur(i.dur)}</span>` : ""}${pct ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}</a>
    <a href="#/watch/${esc(i.videoId)}"><div class="t">${i.ep != null && i.type === "episode" ? `E${i.ep} · ` : ""}${esc(i.t)}</div>
      <div class="s">${TYPE_LABEL[i.type]} · ${new Date(i.pub).toLocaleDateString()}${bad ? '<span class="badge">may not play here</span>' : ""}${h && pct > 92 ? ' · Watched' : ""}</div></a>
    <button class="edit" data-act="edit" data-id="${esc(i.videoId)}" aria-label="Correct this video's details">Edit</button></div>`;
}
function viewWatch(vid) {
  const rec = buildLibrary().videos.get(vid); if (!rec) return notFound();
  const { item: v, anime: a } = rec, { prev, next } = neighbours(vid);
  const list = a.items.filter(i => i.season === v.season);
  setTimeout(() => startPlayer(vid), 0);
  return `<div class="wrap"><div class="watch"><div>
      <div class="player" id="player"><div id="yt"></div></div>
      <h1>${esc(a.title)}</h1><p class="muted">${v.ep != null ? `Season ${v.season} · Episode ${v.ep} · ` : ""}${esc(v.t)}</p>
      <div class="btns"><a class="btn ghost small ${prev ? "" : "sr"}" href="#/watch/${esc(prev?.videoId || vid)}">← Previous</a>
        <a class="btn ghost small ${next ? "" : "sr"}" href="#/watch/${esc(next?.videoId || vid)}">Next →</a>
        <a class="btn ghost small" href="#/anime/${encodeURIComponent(a.id)}">All episodes</a>
        <button class="btn ghost small" data-act="wl" data-id="${esc(a.id)}">${S.watchlist.includes(a.id) ? "In Watchlist ✓" : "Add to Watchlist"}</button></div>
      ${a.seasons.length > 1 ? `<div class="seasonbar">${a.seasons.map(s => { const f = a.episodes.find(e => e.season === s) || a.items.find(i => i.season === s); return `<a class="chip ${s === v.season ? "on" : ""}" href="#/watch/${esc(f.videoId)}">Season ${s}</a>`; }).join("")}</div>` : ""}
    </div><aside class="sidelist"><div class="eplist">${list.map(i => epRow(i, vid)).join("")}</div></aside></div></div>${FOOTER}`;
}
let searchQ = "";
function viewSearch() {
  return `<div class="wrap">${pageHead("Search")}<div class="tools"><input type="search" id="q" placeholder="Search titles and episodes" value="${esc(searchQ)}" autocomplete="off" aria-label="Search"></div><div id="results">${searchResults()}</div></div>${FOOTER}`;
}
function searchResults() {
  const q = searchQ.trim().toLowerCase(); if (!q) return `<div class="empty"><p>Type to search your catalog.</p></div>`;
  const list = enabledAnime().filter(a => a.title.toLowerCase().includes(q) || a.items.some(i => i.t.toLowerCase().includes(q)));
  return grid(list, `No results for "${searchQ}".`);
}
function viewWatchlist() {
  const lib = buildLibrary(), list = S.watchlist.map(id => lib.byId.get(id)).filter(Boolean);
  return `<div class="wrap">${pageHead("Watchlist", "Saved in this browser only.")}${grid(list, "Tap the heart on any title to save it here.")}</div>${FOOTER}`;
}
function viewHistory() {
  const lib = buildLibrary();
  const rows = Object.entries(S.history).map(([vid, h]) => [lib.videos.get(vid), h]).filter(([r]) => r).sort((a, b) => b[1].at - a[1].at);
  return `<div class="wrap">${pageHead("History", "Saved in this browser only.")}
    ${rows.length ? `<div class="btns" style="margin:12px 0"><button class="btn danger small" data-act="clearhist">Clear history</button></div>
    <div class="eplist">${rows.map(([r, h]) => `<div><div class="muted" style="font-size:12px;margin:8px 0 2px">${esc(r.anime.title)} · ${ago(h.at)}</div>${epRow(r.item)}</div>`).join("")}</div>`
    : `<div class="empty"><h2>No history yet</h2><p>Episodes you watch will show up here.</p></div>`}</div>${FOOTER}`;
}
function viewSettings() {
  const s = S.settings;
  return `<div class="wrap">${pageHead("Settings")}
  <div class="panel"><h3>YouTube API key</h3><p>Used only from this browser to read public channel data. In Google Cloud, restrict the key to YouTube Data API v3 and to this site's address (HTTP referrers). No OAuth or sign-in is needed.</p>
    <div class="field"><label for="key">API key</label><input id="key" type="password" autocomplete="off" value="${esc(s.apiKey)}" placeholder="AIza..."></div>
    <button class="btn primary small" data-act="savekey">Save key</button></div>
  <div class="panel"><h3>Playback</h3>
    <label class="switch"><span>Play the next episode automatically</span><input type="checkbox" data-act="pref" data-k="autoNext" ${s.autoNext ? "checked" : ""}></label>
    <label class="switch"><span>Resume where I left off</span><input type="checkbox" data-act="pref" data-k="resume" ${s.resume ? "checked" : ""}></label></div>
  <div class="panel"><h3>Your data</h3><p>Everything personal lives only in this browser. Clearing it cannot be undone.</p>
    <div class="btns"><button class="btn ghost small" data-act="export">Export backup</button>
    <button class="btn ghost small" data-act="clearcache">Clear catalog cache</button>
    <button class="btn danger small" data-act="clearall">Erase everything</button></div></div></div>${FOOTER}`;
}
const notFound = () => `<div class="wrap"><div class="empty"><h2>We couldn't find that page</h2><p>The title may have been removed from the catalog.</p><div class="btns" style="justify-content:center"><a class="btn ghost small" href="#/">Back home</a></div></div></div>`;

/* ---------- 8. Router ---------- */
function route() {
  destroyPlayer();
  const hash = location.hash || "#/", [path] = hash.split("?"), parts = path.slice(2).split("/").map(decodeURIComponent);
  const [r, arg] = parts; let html;
  try {
    html = !r ? viewHome() : r === "explore" ? viewExplore() : r === "providers" ? (arg ? viewProvider(arg) : viewProviders()) :
      r === "anime" ? viewAnime(arg) : r === "watch" ? viewWatch(arg) : r === "search" ? viewSearch() :
      r === "watchlist" ? viewWatchlist() : r === "history" ? viewHistory() : r === "settings" ? viewSettings() : notFound();
  } catch (e) { console.error(e); html = `<div class="wrap"><div class="empty"><h2>Something went wrong</h2><p>The page could not be displayed. Try going back home.</p></div></div>`; }
  $("#app").innerHTML = html;
  renderNav(path); if (!hash.includes("?s=")) scrollTo(0, 0);
  document.title = r === "anime" || r === "watch" ? `${buildLibrary().videos.get(arg)?.anime.title || buildLibrary().byId.get(arg)?.title || "MyCorner"} · MyCorner` : "MyCorner";
}
addEventListener("hashchange", route);

/* ---------- 9. Events ---------- */
const rerender = () => { const y = scrollY; route(); scrollTo(0, y); };
function editDialog(vid) {
  const rec = buildLibrary().videos.get(vid); if (!rec) return;
  const { item: v, anime: a } = rec, dlg = $("#dlg");
  dlg.innerHTML = `<form method="dialog" id="editform" data-id="${esc(vid)}"><h3 style="font:600 18px var(--display)">Correct this video</h3><p class="muted" style="margin:4px 0 8px">${esc(v.t)}</p>
    <div class="field"><label for="e-anime">Anime title</label><input id="e-anime" type="text" value="${esc(a.title)}"></div>
    <div class="field"><label for="e-type">Type</label><select id="e-type">${TYPE_ORDER.map(t => `<option value="${t}" ${v.type === t ? "selected" : ""}>${TYPE_LABEL[t]}</option>`).join("")}</select></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="field"><label for="e-season">Season</label><input id="e-season" type="number" min="1" value="${v.season}"></div>
    <div class="field"><label for="e-ep">Episode</label><input id="e-ep" type="number" min="0" value="${v.ep ?? ""}"></div></div>
    <div class="btns"><button class="btn primary small" value="save">Save</button><button class="btn ghost small" value="reset">Reset to automatic</button><button class="btn ghost small" value="cancel">Cancel</button></div></form>`;
  dlg.showModal();
}
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "SELECT" || el.type === "checkbox") return;
  const { act, id, v } = el.dataset;
  if (act === "wl") {
    e.preventDefault(); e.stopPropagation();
    S.watchlist = S.watchlist.includes(id) ? S.watchlist.filter(x => x !== id) : [id, ...S.watchlist]; save("watchlist"); rerender();
  } else if (act === "stop") { cancelSync = true; el.disabled = true; toast("Stopping after the current request. Everything fetched so far is kept."); }
  else if (act === "sync" || act === "more" || act === "refresh") {
    if (!$("[data-act=stop]")) return; // only runs from a provider page
    const p = S.providers.find(x => x.id === id); document.querySelectorAll("[data-act]:not([data-act=stop])").forEach(b => b.disabled = true);
    $("[data-act=stop]").hidden = false; $("#synclog")?.removeAttribute("hidden"); S.syncLog = [];
    await (act === "refresh" ? refreshProvider(p) : syncProvider(p, { more: act === "more" })); rerender();
    $("#synclog")?.removeAttribute("hidden"); const lg = $("#synclog"); if (lg) lg.textContent = S.syncLog.join("\n");
  } else if (act === "togprov") { const p = S.providers.find(x => x.id === id); p.enabled = !p.enabled; save("providers"); rerender(); }
  else if (act === "addprov") {
    const name = $("#np-name").value.trim(), ref = $("#np-ref").value.trim();
    if (!name || !ref) return toast("Please enter both a name and a handle or channel ID.");
    const pid = slug(name); if (S.providers.some(p => p.id === pid)) return toast("A provider with that name already exists.");
    const isId = /^UC[\w-]{20,}$/.test(ref);
    S.providers.push({ id: pid, name, handle: isId ? "" : ref, channelId: isId ? ref : "", uploadsId: "", logo: "", enabled: true, lastSync: 0 });
    save("providers"); location.hash = `#/providers/${pid}`;
  } else if (act === "ftype") { exploreType = v; rerender(); }
  else if (act === "savekey") { S.settings.apiKey = $("#key").value.trim(); save("settings"); toast("API key saved in this browser."); }
  else if (act === "edit") { e.preventDefault(); editDialog(id); }
  else if (act === "clearhist") { if (confirm("Clear your viewing history on this browser?")) { S.history = {}; save("history"); rerender(); } }
  else if (act === "export") {
    const data = JSON.stringify({ watchlist: S.watchlist, history: S.history, overrides: S.overrides, settings: { ...S.settings, apiKey: "" } }, null, 2);
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([data], { type: "application/json" })), download: "mycorner-backup.json" }); a.click();
  } else if (act === "clearcache") { if (confirm("Remove the saved catalog? You will need to sync again. Your watchlist and history are kept.")) { S.catalog = {}; S.providers.forEach(p => p.lastSync = 0); save("catalog"); save("providers"); invalidate(); toast("Catalog cache cleared."); } }
  else if (act === "clearall") { if (confirm("Erase ALL MyCorner data on this browser, including your API key?")) { Object.keys(localStorage).filter(k => k.startsWith("mc.")).forEach(k => localStorage.removeItem(k)); location.hash = "#/"; location.reload(); } }
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-act]"); if (!el) return; const { act, id, k } = el.dataset;
  if (act === "pref") { S.settings[k] = el.checked; save("settings"); }
  else if (act === "plgroup") { S.ignoredPl[id] = !el.checked; save("ignoredPl"); invalidate(); toast("Grouping updated."); }
  else if (act === "fprov") { exploreProv = el.value; rerender(); }
  else if (act === "fsort") { exploreSort = el.value; rerender(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { searchQ = e.target.value; $("#results").innerHTML = searchResults(); }
});
$("#dlg").addEventListener("close", () => {
  const dlg = $("#dlg"), f = $("#editform"); if (!f) return;
  const vid = f.dataset.id, val = dlg.returnValue;
  if (val === "save") {
    const ep = $("#e-ep").value;
    S.overrides[vid] = { anime: $("#e-anime").value.trim() || undefined, type: $("#e-type").value, season: +$("#e-season").value || 1, ep: ep === "" ? null : +ep };
    save("overrides"); invalidate(); toast("Correction saved. It will survive future syncs.");
    const rec = buildLibrary().videos.get(vid); if (location.hash.startsWith("#/anime/") && rec) location.hash = `#/anime/${encodeURIComponent(rec.anime.id)}`; else rerender();
  } else if (val === "reset") { delete S.overrides[vid]; save("overrides"); invalidate(); rerender(); }
});

route();
</script>
</body>
</html>
