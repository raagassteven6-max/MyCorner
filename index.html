<title>MyCorner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-dim:.82; /* how dark the page background images are (0 = untouched, 1 = black). Raise it if text is hard to read. */
  --obsidian:#101116; --graphite:#191B23; --graphite2:#21242e; --porcelain:#E8E8ED;
  --accent:#9B79FF; /* the one accent color: change this line to re-theme everything */
  --violet:var(--accent); --silver:#777C8B; --line:rgba(232,232,237,.08);
  --nav-h:64px; --radius:12px;
  --display:'Sora',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{background:var(--obsidian);color:var(--porcelain);font:15px/1.5 var(--body);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Layout: top bar on desktop, bottom bar on mobile */
nav.main{position:fixed;z-index:50;background:rgba(16,17,22,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.main .logo{display:none}
nav.main a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--silver);padding:6px 8px;border-radius:10px;transition:color .2s}
nav.main a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.main a.on{color:var(--accent)}
nav.main a.hide-m{display:none}
main{position:relative;z-index:1;padding:0 0 90px;min-height:100vh}
.wrap{padding:0 18px;max-width:1500px;margin:0 auto}
@media(min-width:900px){
  nav.main{top:0;bottom:auto;height:var(--nav-h);justify-content:flex-start;align-items:center;gap:4px;padding:0 40px;border-top:0;backdrop-filter:none;
    background:linear-gradient(180deg,rgba(16,17,22,.96),rgba(16,17,22,.6) 70%,rgba(16,17,22,0))}
  nav.main .logo{display:block;margin-right:28px;font:700 22px var(--display);letter-spacing:-.02em;color:var(--porcelain)}
  nav.main .logo b{color:var(--accent);font-weight:700}
  nav.main a{flex-direction:row;gap:0;font-size:14px;font-weight:500;padding:8px 12px;border-radius:0;border-bottom:2px solid transparent;color:#b9bccb}
  nav.main a:hover{color:var(--porcelain)}
  nav.main a svg{display:none}
  nav.main a.icon svg{display:block;width:20px;height:20px}
  nav.main a.icon span{display:none}
  nav.main a.hide-m{display:flex}
  nav.main a.push{margin-left:auto}
  nav.main a.on{color:var(--porcelain);border-bottom-color:var(--accent)}
  main{padding:var(--nav-h) 0 50px}
  .wrap{padding:0 40px}
}

/* Hero (and the anime page header): artwork fades into the page, so a page background shows through */
.hero,.detail-hero{position:relative;display:flex;align-items:flex-end;overflow:hidden}
.hero{min-height:min(86vh,680px)}
.detail-hero{min-height:420px}
.hero .bg,.detail-hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 22%;
  -webkit-mask-image:linear-gradient(180deg,#000 50%,transparent 98%);mask-image:linear-gradient(180deg,#000 50%,transparent 98%)}
.hero::after,.detail-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(16,17,22,.72),rgba(16,17,22,.22));
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 98%);mask-image:linear-gradient(180deg,#000 55%,transparent 98%)}
.hero .copy,.detail-hero .copy{position:relative;z-index:2;padding:90px 18px 40px;max-width:680px;animation:rise .8s both}
@media(min-width:900px){
  .hero,.detail-hero{margin-top:calc(var(--nav-h) * -1)}
  .hero .bg,.detail-hero .bg{
    -webkit-mask-image:linear-gradient(90deg,transparent 10%,#000 60%),linear-gradient(180deg,#000 60%,transparent 98%);-webkit-mask-composite:source-in;
    mask-image:linear-gradient(90deg,transparent 10%,#000 60%),linear-gradient(180deg,#000 60%,transparent 98%);mask-composite:intersect}
  .hero::after,.detail-hero::after{background:linear-gradient(90deg,rgba(16,17,22,.72),rgba(16,17,22,.1) 55%,transparent)}
  .hero .copy,.detail-hero .copy{padding:120px 40px 64px}
}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.new-badge{padding:2px 8px;border-radius:4px;background:var(--accent);color:#14102a;font-size:11px;letter-spacing:.1em;font-weight:700}
.hero h1,.detail-hero h1{font:700 clamp(32px,5.6vw,60px)/1.05 var(--display);margin:10px 0 10px;letter-spacing:-.025em}
.epline{font-weight:600;font-size:15px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60ch}
.hero p,.detail-hero p{color:#c4c6d0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:58ch}
.meta-line{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:12px;font-size:13px;color:#c4c6d0}
.meta-line span+span::before{content:"\2022";margin-right:10px;color:var(--silver)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:8px;font-weight:600;font-size:14px;transition:transform .15s,background .2s,border-color .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--violet);color:#14102a}
.btn.primary:hover{background:#b095ff}
.btn.ghost{background:rgba(232,232,237,.08);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(232,232,237,.14)}
.btn.small{padding:7px 14px;font-size:13px}
.btn.lg{padding:13px 28px;font-size:15px}
.btn.danger{border:1px solid rgba(255,110,110,.4);color:#ff9a9a}
.btn[disabled]{opacity:.5;pointer-events:none}

/* Rows & cards */
section.row{margin-top:40px;animation:rise .6s both}
.row-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.row-head h2{font:700 14px var(--display);letter-spacing:.14em;text-transform:uppercase}
.row-head a{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--silver)}
.row-head a:hover{color:var(--violet)}
.scroller{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--graphite2) transparent}
.scroller>*{flex:0 0 min(78vw,300px);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{position:relative;display:block;transition:transform .25s}
.card:hover{transform:translateY(-4px)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:var(--graphite) linear-gradient(110deg,var(--graphite) 30%,var(--graphite2) 50%,var(--graphite) 70%);background-size:200% 100%;animation:shimmer 1.6s linear infinite;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .thumb img{transform:scale(1.06)}
.thumb .tag{position:absolute;left:8px;bottom:8px;padding:2px 8px;border-radius:999px;background:rgba(16,17,22,.78);font-size:11px;backdrop-filter:blur(6px)}
.thumb .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.15)}
.thumb .bar i{display:block;height:100%;background:var(--violet)}
.card h3{font:500 14px/1.35 var(--body);margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:var(--silver);margin-top:2px}
.card .status{margin-top:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.card .status+h3{margin-top:2px}
.thumb .logo-chip{position:absolute;top:8px;left:8px;z-index:2;width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--obsidian);border:1px solid var(--line);transform:none}
.card:hover .thumb .logo-chip{transform:none}
.logo-chip.txt{display:grid;place-items:center;font:700 11px var(--display);color:var(--accent)}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .2s;background:rgba(0,0,0,.34)}
.thumb .play>span{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;display:grid;place-items:center;padding-left:3px}
.card:hover .thumb .play,.card:focus-within .thumb .play{opacity:1}
.heart{position:absolute;top:8px;right:8px;z-index:3;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(16,17,22,.7);backdrop-filter:blur(6px);opacity:0;transition:opacity .2s}
.card:hover .heart,.heart.on,.heart:focus-visible{opacity:1}
@media(hover:none){.heart{opacity:1}}
.heart svg{width:16px;height:16px;stroke:var(--porcelain);fill:none;stroke-width:2}
.heart.on svg{fill:var(--violet);stroke:var(--violet)}

/* Page chrome */
.page-head{padding:34px 0 8px;animation:rise .5s both}
.page-head h1{font:700 30px var(--display);letter-spacing:-.02em}
.page-head p{color:var(--silver);margin-top:4px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 22px}
input[type=text],input[type=search],input[type=password],input[type=number],input[type=datetime-local],textarea,select{background:var(--graphite);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--violet);outline:0}
.tools input{flex:1 1 240px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--silver);background:var(--graphite)}
.chip.on{background:rgba(155,121,255,.16);border-color:var(--violet);color:var(--porcelain)}
.panel{background:var(--graphite);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
.panel h3{font:600 16px var(--display);margin-bottom:6px}
.panel p,.muted{color:var(--silver);font-size:13.5px}
.log{white-space:pre-wrap;font:12.5px/1.6 ui-monospace,Menlo,monospace;color:#b9bccb;background:var(--obsidian);border-radius:10px;padding:12px;margin-top:12px;max-height:240px;overflow:auto}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-size:13px;color:var(--silver)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border:0}
.switch input{width:20px;height:20px;accent-color:var(--violet)}
.empty{text-align:center;padding:60px 20px;color:var(--silver)}
.empty h2{color:var(--porcelain);font:600 20px var(--display);margin-bottom:6px}

/* Anime detail */
.seasonbar{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 14px}
.eplist{display:grid;gap:10px}
.ep{display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:center;padding:8px;border-radius:12px;border:1px solid transparent;transition:background .2s}
.ep:hover{background:var(--graphite)}
.ep.now{background:rgba(155,121,255,.12);border-color:rgba(155,121,255,.4)}
.ep .thumb{border-radius:9px}
.ep .t{font-weight:500;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep .s{font-size:12px;color:var(--silver);margin-top:2px}
.ep .edit{opacity:.5;font-size:12px;padding:6px 8px}
.ep .edit:hover{opacity:1;color:var(--violet)}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:rgba(255,160,90,.15);color:#ffb482;margin-left:6px}

/* Watch */
.watch{display:grid;gap:22px;padding-top:18px}
@media(min-width:1100px){.watch{grid-template-columns:minmax(0,1fr) 380px;align-items:start}}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.player iframe,.player>div{position:absolute;inset:0;width:100%;height:100%}
.perror{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;padding:24px;background:var(--graphite);z-index:3}
.perror h3{font:600 18px var(--display)}
.watch h1{font:600 22px/1.25 var(--display);margin:16px 0 4px}
.sidelist{max-height:640px;overflow:auto;padding-right:4px}

/* Page backgrounds: two fixed layers that cross-fade. Only one image is ever loaded per page. */
.pagebg{position:fixed;top:0;left:0;width:100%;height:100%;height:100lvh;z-index:0;pointer-events:none;opacity:0;transition:opacity .7s ease;
  background:center / cover no-repeat}
.pagebg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,17,22,calc(var(--bg-dim) - .06)),rgba(16,17,22,calc(var(--bg-dim) + .1)))}
.pagebg.on{opacity:1}

/* Home: banner and text lists */
.banner{position:relative;display:flex;align-items:flex-end;min-height:320px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--graphite)}
.bn-img{position:absolute;inset:0;background-size:cover;background-position:center 25%;
  -webkit-mask-image:linear-gradient(0deg,transparent,#000 60%);mask-image:linear-gradient(0deg,transparent,#000 60%)}
@media(min-width:900px){.banner{min-height:380px}
  .bn-img{-webkit-mask-image:linear-gradient(90deg,transparent 15%,#000 70%);mask-image:linear-gradient(90deg,transparent 15%,#000 70%)}}
.banner::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(16,17,22,.92),rgba(16,17,22,.45) 60%,rgba(16,17,22,.1))}
@media(min-width:900px){.banner::after{background:linear-gradient(90deg,rgba(16,17,22,.9),rgba(16,17,22,.4) 55%,transparent)}}
.bn-copy{position:relative;z-index:2;padding:30px;max-width:560px}
.bn-copy h3{font:700 clamp(24px,3.4vw,36px)/1.1 var(--display);letter-spacing:-.02em;margin:8px 0}
.bn-copy p{color:#c4c6d0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.picks{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.pick{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 16px;background:var(--graphite);border:1px solid var(--line);border-radius:var(--radius);transition:border-color .2s,transform .2s}
.pick:hover{border-color:rgba(155,121,255,.5);transform:translateY(-2px)}
.pk-main{display:flex;flex:1;gap:14px;min-width:0;align-items:center;padding:8px 0}
.pk-n{font:700 22px var(--display);color:var(--accent);width:26px;flex:none}
.pk-body{display:grid;gap:2px;min-width:0}
.pk-body b{font-weight:600}
.pk-body span{font-size:12.5px;color:var(--silver);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pk-go{font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding:10px 12px}

/* Dev notes */
.field textarea{width:100%;min-height:110px;resize:vertical;line-height:1.5}
.notes-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));margin-top:6px}
.notes-grid .panel{margin:0}
.notes-grid ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.notes-grid li{position:relative;padding-left:16px;color:#c4c6d0;font-size:14px}
.notes-grid li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--violet)}
.notes-grid li b{color:var(--porcelain);font-weight:600}
.sec-title{font:600 19px var(--display);margin:36px 0 4px;letter-spacing:-.01em}
.tl{list-style:none;padding:0 0 0 34px;margin:22px 0 0}
.tl-item{position:relative;padding-bottom:28px;animation:rise .5s both}
.tl-item::before{content:"";position:absolute;left:-30px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 4px rgba(155,121,255,.18)}
.tl-item.built::before{background:var(--obsidian);border:2px solid var(--violet);box-shadow:none}
.tl-item::after{content:"";position:absolute;left:-25px;top:19px;bottom:-5px;width:2px;background:linear-gradient(var(--violet),rgba(155,121,255,.15))}
.tl-item:last-child::after{display:none}
.tl-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--silver);letter-spacing:.03em}
.src{padding:1px 9px;border-radius:999px;font-size:11px;background:rgba(155,121,255,.14);color:var(--violet)}
.src.built{background:rgba(119,124,139,.16);color:var(--silver)}
.tl h3{font:600 16px var(--display);margin:3px 0 4px}
.note-text{color:#c4c6d0;font-size:14px;white-space:pre-wrap;max-width:75ch}
.tl-del{margin-top:6px;font-size:12px;color:var(--silver);padding:4px 0}
.tl-del:hover{color:#ff9a9a}
.copyright{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.06em}
.copyright .dot{width:4px;height:4px;border-radius:50%;background:var(--violet)}
.copyright strong{font:600 12.5px var(--display);letter-spacing:.08em;color:var(--porcelain)}

/* Misc */
footer{margin-top:70px;padding:34px 18px 26px;border-top:1px solid var(--line);color:var(--silver);font-size:12.5px;text-align:center;display:grid;gap:14px;justify-items:center}
footer .ft-logo{font:700 20px var(--display);color:var(--porcelain)}
footer .ft-logo b{color:var(--accent)}
footer p{max-width:62ch}
footer .ft-links{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px}
footer a{text-decoration:underline;text-underline-offset:3px}
footer .ft-logo{text-decoration:none}
footer .copyright{width:100%;max-width:520px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);z-index:99;background:var(--graphite2);border:1px solid var(--line);
  padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;max-width:88vw;white-space:pre-line;font-size:13.5px}
#toast.on{opacity:1;transform:translateX(-50%)}
dialog{background:var(--graphite);color:var(--porcelain);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes drift{to{transform:scale(1.1) translateX(-1.5%)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<nav class="main" id="nav" aria-label="Main"></nav>
<div id="bg0" class="pagebg" aria-hidden="true"></div><div id="bg1" class="pagebg" aria-hidden="true"></div>
<main id="app" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ==========================================================================
   MyCorner — single-file personal anime hub for official YouTube channels.
   Sections: 1 helpers · 2 state · 3 YouTube API · 4 sync · 5 catalog
   · 6 player · 7 views · 8 router · 9 events
   ========================================================================== */

/* ---------- 1. Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = s => s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "untitled";
const sleep = ms => new Promise(r => setTimeout(r, ms));
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 3800);
}
function fmtDur(sec) {
  if (!sec) return "";
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}
function isoToSec(iso = "") {
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/) || [];
  return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
}
const ago = ts => {
  const d = (Date.now() - ts) / 864e5;
  return d < 1 ? "today" : d < 2 ? "yesterday" : d < 30 ? `${Math.floor(d)} days ago` : new Date(ts).toLocaleDateString();
};

/* ---------- 2. State (everything personal stays in this browser) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("mc." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) {
    try { localStorage.setItem("mc." + k, JSON.stringify(v)); return true; }
    catch { toast("Browser storage is full or blocked, so this change was not saved.\nTry clearing the catalog cache in Settings."); return false; }
  }
};
const DEFAULT_PROVIDERS = [{
  id: "muse-asia", name: "Muse Asia", handle: "@MuseAsia", channelId: "", uploadsId: "", logo: "", enabled: true, lastSync: 0
}];
const S = {
  settings: { apiKey: "", autoNext: true, resume: true, backgrounds: true, ...store.get("settings", {}) },
  providers: store.get("providers", DEFAULT_PROVIDERS),
  catalog: {},                           // providerId -> { videos, playlists, syncedAt }. Lives in IndexedDB; loaded by initStorage()
  overrides: store.get("overrides", {}), // videoId -> manual corrections (preserved across syncs)
  ignoredPl: store.get("ignoredPl", {}), // playlistId -> true/false (manual playlist include/exclude)
  watchlist: store.get("watchlist", []), // anime ids
  history: store.get("history", {}),     // videoId -> { pos, dur, at, anime }
  blocked: store.get("blocked", {}),     // videoId -> YouTube error code seen in the player
  notes: (() => { const n = store.get("notes", []); // dev notes written by me; validated because storage is just text
    return Array.isArray(n) ? n.filter(x => x && typeof x.text === "string" && Number.isFinite(x.at)).map(x => ({ id: String(x.id ?? x.at), at: x.at, title: String(x.title || "").slice(0, 120), text: x.text.slice(0, 5000) })) : []; })(),
  links: store.get("links", {}),         // animeId -> [animeId on other providers] (manual "same show" links)
  snapshotAt: 0,                         // when the published catalog.json was exported (0 = using this browser's own catalog)
  syncLog: []
};
/* The catalog can be large, so it lives in IndexedDB (hundreds of MB available) instead of localStorage (about 5 MB).
   Small personal data stays in localStorage. If IndexedDB is unavailable (some private modes), the catalog falls back to localStorage. */
const idb = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("mycorner", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("kv");
      req.onsuccess = () => { idb.db = req.result; resolve(); };
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error("blocked"));
    });
  },
  run(mode, fn) { // resolves only after the transaction has fully committed
    return new Promise((resolve, reject) => {
      const tx = idb.db.transaction("kv", mode); let out;
      const r = fn(tx.objectStore("kv")); if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => resolve(out);
      tx.onerror = tx.onabort = () => reject(tx.error || new Error("IndexedDB transaction failed"));
    });
  },
  get: k => idb.run("readonly", st => st.get(k)),
  set: (k, v) => idb.run("readwrite", st => st.put(v, k)),
  wipe() {
    return new Promise(done => {
      try { idb.db?.close(); const r = indexedDB.deleteDatabase("mycorner"); r.onsuccess = r.onerror = r.onblocked = () => done(); }
      catch { done(); }
    });
  }
};
let idbOk = false, writeQueued = false, idbChain = Promise.resolve();
function saveCatalog() {
  if (!idbOk) return store.set("catalog", S.catalog);
  if (writeQueued) return;  // a write that has not started yet will already pick up the latest data
  writeQueued = true;
  idbChain = idbChain.then(() => { writeQueued = false; return idb.set("catalog", S.catalog); })
    .catch(() => toast("The catalog could not be saved in this browser.\nIt still works until you close this page. Free some disk space, then sync again."));
}
const save = k => k === "catalog" ? saveCatalog() : store.set(k, S[k]);
async function initStorage() {
  try { await idb.open(); idbOk = true; } catch { idbOk = false; }
  if (!idbOk) { S.catalog = store.get("catalog", {}); return; }
  try {
    let c = await idb.get("catalog");
    const legacy = store.get("catalog", null);
    if (!c && legacy) { await idb.set("catalog", legacy); c = legacy; } // one-time move from localStorage, committed before anything is removed
    if (legacy) { try { localStorage.removeItem("mc.catalog"); } catch { /* ignore */ } }
    S.catalog = c || {};
  } catch { idbOk = false; S.catalog = store.get("catalog", {}); }
  invalidate();
}
let libCache = null;
const invalidate = () => { libCache = null; };

/* ---------- 3. YouTube Data API v3 (quota-aware) ---------- */
class ApiError extends Error { constructor(msg, code) { super(msg); this.code = code; } }
let quotaUsed = 0, cancelSync = false; // quotaUsed counts requests this session (each costs 1 unit here)
const ytCache = new Map(); // short-lived in-memory cache for identical requests
async function yt(endpoint, params, { retries = 2 } = {}) {
  if (!S.settings.apiKey) throw new ApiError("No YouTube API key is set.\nOpen Settings and paste your key first.", "nokey");
  const qs = new URLSearchParams({ ...params, key: S.settings.apiKey });
  const url = `https://www.googleapis.com/youtube/v3/${endpoint}?${qs}`;
  const hit = ytCache.get(url);
  if (hit && Date.now() - hit.at < 60000) return hit.data;
  for (let attempt = 0; ; attempt++) {
    // A request that never answers would freeze the whole sync, so every attempt gets 30 seconds, then counts as a network failure.
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
    const watch = setInterval(() => { if (cancelSync) ctl.abort(); }, 150); // Stop cuts the waiting request short instead of waiting for it
    let res, body;
    try {
      res = await fetch(url, { signal: ctl.signal });
      try { body = await res.json(); } catch (e) { if (ctl.signal.aborted) throw e; body = null; }
    } catch {
      clearTimeout(timer); clearInterval(watch);
      if (cancelSync) throw new ApiError("Stopped.", "cancelled");
      if (attempt < retries) { await sleep(800 * 2 ** attempt); continue; }
      throw new ApiError("Could not reach YouTube.\nIt did not answer in time or the connection failed. Check your internet connection and try again.", "network");
    }
    clearTimeout(timer); clearInterval(watch);
    if (res.ok) {
      if (!body) throw new ApiError("YouTube sent a reply that could not be read.\nTry again in a moment.", "http");
      quotaUsed++; ytCache.set(url, { at: Date.now(), data: body }); return body;
    }
    body = body || {};
    const reason = body?.error?.errors?.[0]?.reason || "";
    // Short bursts of requests can trip a rate limit that is separate from the daily quota. Waiting briefly fixes it.
    if ((res.status === 403 || res.status === 429) && /ratelimit/i.test(reason) && attempt < 4) { await sleep(1500 * 2 ** attempt); if (cancelSync) throw new ApiError("Stopped.", "cancelled"); continue; }
    if (res.status >= 500 && attempt < retries) { await sleep(800 * 2 ** attempt); continue; }
    if (reason === "quotaExceeded" || reason === "dailyLimitExceeded")
      throw new ApiError("YouTube's daily quota for your API key is used up.\nIt resets at midnight Pacific Time. Your saved catalog still works, so you can sync again tomorrow.", "quota");
    if (reason === "keyInvalid" || reason === "API_KEY_INVALID" || res.status === 400 && /key/i.test(body?.error?.message || ""))
      throw new ApiError("YouTube rejected the API key.\nCheck that it was pasted correctly and that YouTube Data API v3 is enabled for it.", "key");
    if (res.status === 403)
      throw new ApiError("YouTube refused this request (403).\nIf you set an HTTP referrer restriction on the key, make sure it includes this site's address.", "forbidden");
    throw new ApiError(`YouTube returned an error (${res.status}${reason ? ", " + reason : ""}).`, "http");
  }
}
const bestThumb = t => (t?.maxres || t?.standard || t?.high || t?.medium || t?.default)?.url || "";

/* ---------- 4. Synchronization ---------- */
const log = line => {
  S.syncLog.push(`${new Date().toLocaleTimeString()}  ${line}`);
  const el = $("#synclog"); if (el) { el.textContent = S.syncLog.join("\n"); el.scrollTop = el.scrollHeight; }
};
function compactVideo(v) {
  return {
    id: v.id, t: v.snippet?.title || "", d: (v.snippet?.description || "").slice(0, 400),
    th: bestThumb(v.snippet?.thumbnails), pub: Date.parse(v.snippet?.publishedAt) || 0,
    dur: isoToSec(v.contentDetails?.duration), emb: v.status?.embeddable !== false,
    priv: v.status?.privacyStatus || "public", rr: v.contentDetails?.regionRestriction || null,
    vc: +v.statistics?.viewCount || 0, at: Date.now()
  };
}
async function fetchVideos(ids) {
  const out = [];
  for (let i = 0; i < ids.length; i += 50) {
    const r = await yt("videos", { part: "snippet,contentDetails,status,statistics", id: ids.slice(i, i + 50).join(","), maxResults: 50 });
    out.push(...(r.items || []).map(compactVideo));
  }
  return out;
}
async function resolveChannel(p) {
  if (p.channelId && p.uploadsId) return;
  const params = { part: "snippet,contentDetails" };
  if (p.channelId) params.id = p.channelId; else params.forHandle = p.handle.startsWith("@") ? p.handle : "@" + p.handle;
  const r = await yt("channels", params);
  const ch = r.items?.[0];
  if (!ch) throw new ApiError(`No channel was found for "${p.channelId || p.handle}".\nOpen the provider's settings and enter its official channel ID (it starts with UC).`, "nochannel");
  p.channelId = ch.id; p.uploadsId = ch.contentDetails.relatedPlaylists.uploads;
  p.logo = ch.snippet.thumbnails?.medium?.url || ch.snippet.thumbnails?.default?.url || "";
  log(`Channel found: ${ch.snippet.title}`);
}
const BATCH_LIMIT = 200;   // videos loaded per press: the first sync and each "Load older" press
const MAX_PAGES = 40;      // hard safety stop per run (40 pages = 2,000 videos)
/* Walks the uploads playlist newest-first. Every page is saved immediately, so quota already spent is never lost.
   stopAtKnown: stop at the first video we already have (cheap "what's new" check).
   Returns where it stopped so "Load older" can resume from there. */
async function scanUploads(p, cat, startToken, { stopAtKnown, limit }) {
  let token = startToken, added = 0, pages = 0, hitKnown = false;
  while (pages < MAX_PAGES && added < limit && !cancelSync) {
    const r = await yt("playlistItems", { part: "contentDetails", playlistId: p.uploadsId, maxResults: 50, ...(token && { pageToken: token }) });
    pages++;
    const fresh = [];
    for (const it of r.items || []) {
      const id = it.contentDetails.videoId;
      if (cat.videos[id]) { if (stopAtKnown) { hitKnown = true; break; } continue; }
      fresh.push(id);
    }
    if (fresh.length) {
      for (const v of await fetchVideos(fresh)) cat.videos[v.id] = v;
      added += fresh.length; save("catalog");
    }
    token = r.nextPageToken || "";
    log(`Page ${pages}: ${fresh.length} new video(s), ${Object.keys(cat.videos).length} stored in total.`);
    if (hitKnown || !token) break;
  }
  return { added, token, hitKnown, pages };
}
const GAP_LIMIT = 1000; // max playlist videos fetched per run (1000 videos = about 20 quota units)
/* Videos that appear in an official playlist but are not stored yet. IDs YouTube already told us it cannot return
   (deleted, private) are remembered in cat.missing so we do not ask for them again on every sync. */
function pendingGaps(cat) {
  const want = new Set(), skip = cat.missing || {};
  for (const pl of Object.values(cat.playlists)) {
    if (plIgnored(pl)) continue;
    for (const id of pl.items) if (!cat.videos[id] && !skip[id]) want.add(id);
  }
  return [...want];
}
async function fillPlaylistGaps(cat) {
  cat.missing ||= {};
  const all = pendingGaps(cat), ids = all.slice(0, GAP_LIMIT);
  if (!ids.length) return log("Playlists are complete: every listed video is already stored.");
  log(`Fetching ${ids.length} video(s) that playlists list but you don't have yet${all.length > ids.length ? ` (${all.length - ids.length} more on the next sync)` : ""}...`);
  let fetched = 0, gone = 0;
  for (let i = 0; i < ids.length && !cancelSync; i += 50) {
    const chunk = ids.slice(i, i + 50), got = await fetchVideos(chunk), seen = new Set(got.map(v => v.id));
    got.forEach(v => { cat.videos[v.id] = v; });
    chunk.filter(id => !seen.has(id)).forEach(id => { cat.missing[id] = Date.now(); gone++; });
    fetched += got.length; save("catalog");
    log(`Playlist videos fetched: ${fetched} of ${ids.length}.`);
  }
  if (gone) log(`${gone} listed video(s) are deleted or private, so they were skipped.`);
}
async function syncProvider(p, { more = false } = {}) {
  S.syncLog = []; cancelSync = false; const startQuota = quotaUsed;

    await resolveChannel(p);

      if (!cat.olderToken) { log("There are no older videos left to load."); return; }
      log(`Loading up to ${BATCH_LIMIT} older videos...`);
      const r = await scanUploads(p, cat, cat.olderToken, { stopAtKnown: false, limit: BATCH_LIMIT });
      cat.olderToken = r.token; cat.complete = !r.token;
      worked = true;
      log(r.token ? `Done. Press "Load older videos" again if you want more.` : "Done. You now have the channel's complete upload history.");
    } else {
      log(empty ? `First sync: loading the newest ${BATCH_LIMIT} videos. You can load older ones afterwards.` : "Checking for new videos...");
      const r = await scanUploads(p, cat, "", { stopAtKnown: !empty, limit: BATCH_LIMIT });
      if (empty) { cat.olderToken = r.token; cat.complete = !r.token; }

    }

    // Official playlists define anime groups and episode order. Unchanged playlists are skipped to save quota.
    log("Reading official playlists...");

      const r = await yt("playlists", { part: "snippet,contentDetails", channelId: p.channelId, maxResults: 50, ...(token && { pageToken: token }) });
      pls.push(...(r.items || [])); token = r.nextPageToken;

    // hundreds of playlists finish in minutes, and progress is reported and saved as it goes.
    const todo = pls.filter(pl => { const old = cat.playlists[pl.id]; return !(old && old.count === pl.contentDetails.itemCount); });

            items.push(...(r.items || []).map(i => i.contentDetails.videoId)); t2 = r.nextPageToken;

          touched++; failStreak = 0;

          // connection or key is the real problem, so the sync stops with that message.
          if (e instanceof ApiError && (e.code === "http" || e.code === "network") && ++failStreak < 5) { skipped++; log(`Skipped playlist "${pl.snippet.title}" (it will be tried again next sync).\n${e.message}`); }

    if (fatal) throw fatal;

    if (!cancelSync) await fillPlaylistGaps(cat);

  } catch (e) {
    if (e instanceof ApiError && e.code === "cancelled") log("Stopped by you. Everything fetched so far was saved.");
    else { log(`Stopped: ${e.message}`); toast(e.message); }
  } finally {

    log(`About ${quotaUsed - startQuota} quota unit(s) used in this run (your daily limit is 10,000).`);

}

    const member = new Map();
    Object.values(cat.playlists).filter(pl => !plIgnored(pl)).sort((a, b) => a.items.length - b.items.length)
      .forEach(pl => pl.items.forEach((id, i) => { if (!member.has(id)) member.set(id, { title: pl.title, index: i }); }));

      r === "anime" ? viewAnime(arg) : r === "watch" ? viewWatch(arg) : r === "search" ? viewSearch() :
      r === "watchlist" ? viewWatchlist() : r === "history" ? viewHistory() : r === "notes" ? (isAdmin() ? viewNotes() : notFound()) : r === "settings" ? viewSettings() : notFound();

  else if (act === "importsnap") { $("#snapfile").click();
  } else if (act === "ftype") { exploreType = v; rerender(); }
  else if (act === "savekey") { S.settings.apiKey = $("#key").value.trim(); save("settings"); renderNav(location.hash.split("?")[0] || "#/"); toast("API key saved in this browser."); }
  else if (act === "addnote") { addNote(); }
  else if (act === "delnote") { if (confirm("Delete this note?\nThis cannot be undone.")) { S.notes = S.notes.filter(n => n.id !== id); save("notes"); rerender(); } }
  else if (act === "edit") { e.preventDefault(); editDialog(id); }
  else if (act === "clearhist") { if (confirm("Clear your viewing history on this browser?")) { S.history = {}; save("history"); rerender(); } }
  else if (act === "export") {
    downloadJson({ watchlist: S.watchlist, history: S.history, overrides: S.overrides, links: S.links, notes: S.notes, settings: { ...S.settings, apiKey: "" } }, "mycorner-backup.json", true);
  } else if (act === "clearcache") { if (confirm("Remove the saved catalog? You will need to sync again. Your watchlist and history are kept.")) { S.catalog = {}; S.providers.forEach(p => p.lastSync = 0); save("catalog"); save("providers"); invalidate(); toast("Catalog cache cleared."); } }
  else if (act === "clearall") { if (confirm("Erase ALL MyCorner data on this browser, including your API key and your dev notes?\nThis cannot be undone.")) { Object.keys(localStorage).filter(k => k.startsWith("mc.")).forEach(k => localStorage.removeItem(k)); await idb.wipe(); location.hash = "#/"; location.reload(); } }
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-act]"); if (!el) return; const { act, id, k } = el.dataset;
  if (act === "pref") { S.settings[k] = el.checked; save("settings"); if (k === "backgrounds") applyBackground(); }
  else if (act === "plgroup") { S.ignoredPl[id] = !el.checked; save("ignoredPl"); invalidate(); toast("Grouping updated."); }
  else if (act === "fprov") { exploreProv = el.value; rerender(); }
  else if (act === "fsort") { exploreSort = el.value; rerender(); }
});
document.addEventListener("change", async e => {
  if (e.target.id !== "snapfile") return;
  const file = e.target.files?.[0]; e.target.value = ""; if (!file) return;
  let clean = null;
  try { clean = cleanSnapshot(JSON.parse(await file.text())); } catch { /* reported just below */ }
  if (!clean) return toast("That file isn't a MyCorner catalog export.\nChoose a catalog.json created with Export catalog.json.");
  const n = clean.providers.length;
  if (!confirm(`Replace the catalog in this browser with the file's contents (${n} provider${n === 1 ? "" : "s"})?\nYour watchlist and history are kept.`)) return;
  applySnapshot(clean, true); toast("Catalog imported."); rerender();
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { searchQ = e.target.value; $("#results").innerHTML = searchResults(); }
});
$("#dlg").addEventListener("close", () => {
  const dlg = $("#dlg"), val = dlg.returnValue, ef = $("#editform"), pf = $("#provform"), lf = $("#linkform");
  if (ef) {
    const vid = ef.dataset.id;
    if (val === "save") {
      const ep = $("#e-ep").value;
      S.overrides[vid] = { anime: $("#e-anime").value.trim() || undefined, type: $("#e-type").value, season: +$("#e-season").value || 1, ep: ep === "" ? null : +ep };
      save("overrides"); invalidate(); toast("Correction saved. It will survive future syncs.");
      const rec = buildLibrary().videos.get(vid); if (location.hash.startsWith("#/anime/") && rec) location.hash = `#/anime/${encodeURIComponent(rec.anime.id)}`; else rerender();
    } else if (val === "reset") { delete S.overrides[vid]; save("overrides"); invalidate(); rerender(); }
  } else if (pf && val === "save") {
    const p = S.providers.find(x => x.id === pf.dataset.id); if (!p) return;
    const name = $("#pv-name").value.trim(), ref = parseChannelRef($("#pv-ref").value);
    if (!name || !ref) return toast("Please enter a name and a valid handle, channel link or channel ID.\nExample: @AniOneAsia");
    const dup = duplicateProvider(ref, p); if (dup) return toast(`That channel is already added as ${dup.name}.`);
    const n = Object.keys(S.catalog[p.id]?.videos || {}).length;
    if (n && refChanged(p, ref) && !confirm(`This points ${p.name} at a different channel.\nIts ${n} saved videos will be removed and you will need to sync again. Continue?`)) return;
    const reset = applyProviderEdit(p, name, ref);
    save("providers"); save("catalog"); invalidate(); toast(reset ? "Provider updated. Press Sync new videos to load its catalog." : "Provider updated."); rerender();
  } else if (lf && val === "save") {
    const a = S.providers.length && buildLibrary().byId.get(lf.dataset.id), label = $("#lk-in").value.trim();
    const other = a && buildLibrary().anime.find(x => x.providerId !== a.providerId && linkLabel(x) === label);
    if (!other) return toast("Please pick a title from the suggestions list.\nStart typing and choose one of the matches.");
    linkAnime(a.id, other.id); toast(`Linked to ${other.provider}.`); rerender();
  }
});

loadingSnap = true; route(); // shows "Loading the catalog..." until storage is ready
initStorage().then(() => {
  loadingSnap = location.protocol.startsWith("http") && !hasLocalCatalog(); // no local catalog: try the published catalog.json
  if (loadingSnap) loadSnapshot(); else route();
});
</script>
</body>
</html>
